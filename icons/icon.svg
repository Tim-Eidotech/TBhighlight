<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <clipPath id="left-half">
      <rect x="0" y="0" width="24" height="48"/>
    </clipPath>
    <clipPath id="right-half">
      <rect x="24" y="0" width="24" height="48"/>
    </clipPath>
  </defs>

  <!-- Left half: internal / blue -->
  <g clip-path="url(#left-half)">
    <rect x="4" y="13" width="40" height="30" rx="2" ry="2"
          fill="#CCE0FF" stroke="#5588BB" stroke-width="2"/>
    <polyline points="4,13 24,30 44,13"
              fill="none" stroke="#5588BB" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Right half: external / pink -->
  <g clip-path="url(#right-half)">
    <rect x="4" y="13" width="40" height="30" rx="2" ry="2"
          fill="#FFB3C1" stroke="#CC5566" stroke-width="2"/>
    <polyline points="4,13 24,30 44,13"
              fill="none" stroke="#CC5566" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Centre divider -->
  <line x1="24" y1="11" x2="24" y2="45" stroke="#444" stroke-width="1.5"/>
</svg>
